version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chicksum-postgres
    restart: always
    environment:
      POSTGRES_USER: chicksum_user
      POSTGRES_PASSWORD: chicksum_secret_password
      POSTGRES_DB: chicksum_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chicksum_user -d chicksum_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chicksum-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
